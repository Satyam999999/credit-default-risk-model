name: creditrisk
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn>=1.3
  - matplotlib
  - xgboost>=2.0
  - lightgbm>=4.0
  - shap>=0.44
  - imbalanced-learn>=0.11
  - sqlalchemy>=2.0
  - psycopg2-binary
  - xlrd        # reads the UCI .xls file
  - openpyxl
  - joblib
  - pytest
